# Unit and scientific tests on Windows and Linux (proposal V6 ENV-09).
# CPU wheels only; Docling, GPU and the PDF-dependent integration/golden
# tests are outside this job. Model weights download on each run.
name: tests

on:
  push:
  pull_request:

jobs:
  venv-symlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install "pytest>=8.0.0,<=9.1.1"
      - name: Verify real Linux venv symlink behavior
        run: python -m pytest tests/unit/test_venv_interpreter_paths.py::test_real_linux_venv_package_is_lost_only_when_python_symlink_is_resolved -q -p no:cacheprovider

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch wheels)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-legacy.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Models
        run: |
          python scripts/setup_vietocr_model.py
          python scripts/setup_models.py
      - name: Tests
        run: python -m pytest tests/unit tests/scientific -q -p no:cacheprovider
