profiles:
  fast:
    profile: fast
    native_first: true
    render_dpi: 150
    primary_engine: rapidocr
    layout: light
    fallback_enabled: false
    batch_size: 16
    orientation_fallback_enabled: true
    vector_table_min_native_score: 0.90
    skip_vector_tables_on_restricted_pdf: true
    two_up_detection_enabled: true
    multi_region_detection_enabled: true
    native_quality:
      reliable_threshold: 0.90
      review_threshold: 0.70

  balanced:
    profile: balanced
    native_first: true
    render_dpi: 180
    primary_engine: vietocr
    layout: standard
    fallback_enabled: false
    fallback_only_on_review: true
    max_fallback_region_ratio: 0.15
    max_fallback_regions_per_page: 5
    fallback_upscale_dpi: 250
    min_confidence: 0.80
    batch_size: 8
    orientation_fallback_enabled: true
    vector_table_min_native_score: 0.90
    skip_vector_tables_on_restricted_pdf: true
    two_up_detection_enabled: true
    multi_region_detection_enabled: true
    native_quality:
      reliable_threshold: 0.90
      review_threshold: 0.70

  accuracy:
    profile: accuracy
    native_first: true
    render_dpi: 180
    primary_engine: vietocr
    layout: accurate
    fallback_enabled: true
    adaptive_second_pass: true
    max_fallback_region_ratio: 0.25
    max_fallback_regions_per_page: 30
    fallback_upscale_dpi: 300
    regional_retry_enabled: true
    min_confidence: 0.85
    batch_size: 8
    orientation_fallback_enabled: true
    vector_table_min_native_score: 0.92
    skip_vector_tables_on_restricted_pdf: true
    two_up_detection_enabled: true
    multi_region_detection_enabled: true
    native_quality:
      reliable_threshold: 0.92
      review_threshold: 0.75
